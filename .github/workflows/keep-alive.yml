name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Call Render Health Endpoint
        run: |
          curl -I https://meetscribe-gateway.onrender.com/actuator/health
          curl -I https://meetscribe-server.onrender.com/actuator/health
