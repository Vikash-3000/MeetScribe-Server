server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: meetscribe-gateway

  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader

      routes:

        - id: auth-oauth
          uri: https://meetscribe-server.onrender.com
          predicates:
            - Path=/oauth2/**,/login/oauth2/**

        - id: backend-api
          uri: ${BACKEND_URL}
          predicates:
            - Path=/users/**,/api/**
          filters:
            - AddResponseHeader=X-Gateway, MeetScribe

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web: DEBUG