server:
  port: 8080

spring:
  application:
    name: meetscribe-gateway

  cloud:
    gateway:
      forwarded:
        enabled: true

      routes:
        - id: auth-oauth
          uri: http://meetscribe-backend:8081
          predicates:
            - Path=/oauth2/**,/login/oauth2/**
          filters:
            - PreserveHostHeader
            - AddResponseHeader=X-Gateway, MeetScribe

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

  data:
    redis:
      host: redis
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  backend:
    uri: http://meetscribe-backend:8081
