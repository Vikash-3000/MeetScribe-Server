server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/meetscribe
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile

security:
  jwt:
    secret: YOUR_JWT_SECRET_KEY
    expiry: 3600000