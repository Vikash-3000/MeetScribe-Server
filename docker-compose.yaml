services:

  gateway:
    container_name: meetscribe-gateway
    build:
      context: ./meetscribe-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"          # ✅ ONLY PUBLIC ENTRY
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    container_name: meetscribe-backend
    build:
      context: ./meetscribe-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "8081"              # ✅ INTERNAL ONLY (Docker network)

  postgres:
    image: postgres:16
    container_name: meetscribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetscribe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # DEV ONLY       # ✅ INTERNAL ONLY
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: meetscribe-redis
    restart: unless-stopped
    expose:
      - "6379"              # ✅ INTERNAL ONLY
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
