server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: meetscribe-gateway

  cloud:
    gateway:
      forwarded:
        enabled: true

      default-filters:
        - AddResponseHeader=X-Content-Type-Options,nosniff
        - AddResponseHeader=X-Frame-Options,DENY
        - AddResponseHeader=X-XSS-Protection,1; mode=block

      routes:
        - id: auth
          uri: ${BACKEND_URL}
          predicates:
            - Path=/oauth2/**,/login/**
          filters:
            - TokenRelay

        - id: api
          uri: ${BACKEND_URL}
          predicates:
            - Path=/api/**,/users/**
          filters:
            - TokenRelay

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  backend:
    uri: ${BACKEND_URL}
