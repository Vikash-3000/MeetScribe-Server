server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  jackson:
    time-zone: UTC

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

security:
  refresh:
    secret: ${REFRESH_SECRET}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN