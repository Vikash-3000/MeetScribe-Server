server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: meetscribe-gateway

  cloud:
    gateway:
      forwarded:
        enabled: true

      default-filters:
        - AddResponseHeader=X-Content-Type-Options,nosniff
        - AddResponseHeader=X-Frame-Options,DENY
        - AddResponseHeader=X-XSS-Protection,1; mode=block

      routes:
        # 🔐 OAuth routes
        - id: auth-oauth
          uri: https://meetscribe-server.onrender.com
          predicates:
            - Path=/oauth2/**,/login/oauth2/**
          filters:
            - PreserveHostHeader
            - StripPrefix=0
            - AddRequestHeader=X-Forwarded-Proto, https

        # ✅ BACKEND API ROUTES (ADD THIS)
        - id: backend-api
          uri: ${BACKEND_URL}
          predicates:
            - Path=/users/**,/api/**
          filters:
            - PreserveHostHeader
            - AddResponseHeader=X-Gateway, MeetScribe

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  backend:
    uri: ${BACKEND_URL}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web: DEBUG