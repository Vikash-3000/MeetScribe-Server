server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: meetscribe-gateway

  codec:
    max-in-memory-size: 2MB

  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
        - AddResponseHeader=X-Content-Type-Options,nosniff
        - AddResponseHeader=X-Frame-Options,DENY
        - AddResponseHeader=X-XSS-Protection,1; mode=block

      routes:
        - id: auth-oauth
          uri: ${BACKEND_URL}
          predicates:
            - Path=/oauth2/**,/login/oauth2/**

        - id: backend-api
          uri: ${BACKEND_URL}
          predicates:
            - Path=/users/**,/api/**
          filters:
            - AddResponseHeader=X-Gateway, MeetScribe
            - name: Retry
              args:
                retries: 2

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          max-connections: 200
          acquire-timeout: 45s

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

services:
  backend:
    uri: ${BACKEND_URL}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN