server:
  port: 8080

spring:
  application:
    name: meetscribe-gateway

  cloud:
    gateway:
      forwarded:
        enabled: true

      default-filters:
        - AddResponseHeader=X-Content-Type-Options,nosniff
        - AddResponseHeader=X-Frame-Options,DENY
        - AddResponseHeader=X-XSS-Protection,1; mode=block

      routes:
        # ✅ BACKEND API ROUTES (ADD THIS)
        - id: backend
          uri: ${BACKEND_URL}
          predicates:
            - Path=/api/**,/users/**,/login/**,/oauth2/**
          filters:
            - PreserveHostHeader
            - TokenRelay

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  backend:
    uri: ${BACKEND_URL}
