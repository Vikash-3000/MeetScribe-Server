server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful

  servlet:
    session:
      cookie:
        secure: true
        same-site: none

spring:
  application:
    name: meetscribe-server

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    time-zone: UTC

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  session:
    store-type: redis

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

security:
  refresh:
    secret: ${REFRESH_SECRET}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN