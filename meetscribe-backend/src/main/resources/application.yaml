server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

spring:
  jackson:
    time-zone: UTC

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

security:
  refresh:
    secret: ${REFRESH_SECRET}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG